<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Oops — Page Not Found 🐰</title>
    <style>
      :root {
        --pink: #c43d7f;
        --pink-light: #fff5f7;
        --green: #4a9a3f;
        --text: #2d1b2e;
        --text-soft: #7a5a7a;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --pink-light: #2a1a2c;
          --text: #f5e8f5;
          --text-soft: #c9a8c9;
        }
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--pink-light);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        padding-bottom: env(safe-area-inset-bottom);
      }

      .card {
        background: white;
        border: 1px solid #ffc1d4;
        border-radius: 24px;
        padding: 3rem 2.5rem;
        text-align: center;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 8px 40px rgba(220, 90, 150, 0.12);
      }

      @media (prefers-color-scheme: dark) {
        .card {
          background: #341f38;
          border-color: #5a3060;
        }
      }

      .emoji {
        font-size: 4rem;
        display: block;
        margin-bottom: 1.25rem;
        animation: hop 2s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .emoji { animation: none; }
      }

      @keyframes hop {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
      }

      h1 {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 2.2rem;
        font-weight: normal;
        font-style: italic;
        color: var(--text);
        margin-bottom: 0.75rem;
      }

      p {
        color: var(--text-soft);
        font-size: 1.1rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }

      a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.75rem;
        background: var(--pink);
        color: white;
        border-radius: 9999px;
        text-decoration: none;
        font-size: 1rem;
        font-weight: 500;
        min-height: 48px;
        transition: opacity 0.2s;
      }

      a:hover { opacity: 0.85; }
      a:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="emoji">🐰</span>
      <h1>Oops!</h1>
      <p>This page went on a walk with the bunnies and got a little lost.</p>
      <a href="/">Go back home 🌸</a>
    </div>
  </body>
</html>
